name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx turbo run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # apps/api's conflictResolver tests run against the real DynamoDB
      # Local (the official AWS emulator, not a reimplementation) because
      # it's the only local DynamoDB that implements TransactWriteItems —
      # see apps/api/test/helpers/dynamoDbLocal.ts.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Cache DynamoDB Local
        uses: actions/cache@v4
        with:
          path: ~/.cache/stocksync-dynamodb-local
          key: dynamodb-local
      - run: npm ci
      - run: npx turbo run test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx turbo run build
